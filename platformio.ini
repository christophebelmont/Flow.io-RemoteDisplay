[platformio]
default_envs = FlowConnectDisplay

[common]
flow_connect_display_firmware_version = '"0.7.1"'
nextion_firmware_version = '"6.0.0"'

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain
monitor_speed = 115200
monitor_filters = direct
debug_tool = esp-prog
debug_init_break = tbreak setup
upload_protocol = esptool
board_build.filesystem = spiffs
board_build.partitions = partitions_remote_display.csv
extra_scripts =
	pre:scripts/generate_build_version.py
	pre:scripts/generate_datamodel.py
	pre:scripts/generate_runtimeui_manifest.py
	pre:scripts/prepare_spiffs_data.py

[env:FlowConnectDisplay]
custom_version = ${common.flow_connect_display_firmware_version}
build_flags =
	-std=c++17
	-std=gnu++17
	-D ESP32_DEVKITV1
	-D CORE_DEBUG_LEVEL=0
	-D CONFIG_LOG_COLORS=1
	-D BOARD_REV=1
	-D FLOW_ENABLE_BUFFER_USAGE_TRACKING=0
	-D FLOW_PROFILE_FLOW_CONNECT_DISPLAY=1
	-D FIRMW=${common.flow_connect_display_firmware_version}
	-D TFT_FIRMW=${common.nextion_firmware_version}
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
build_src_filter =
	+<*>
	-<Modules/HMIModule/>
	+<Modules/HMIModule/Drivers/NextionDriver.cpp>
build_unflags =
	-std=gnu++11
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.5
